resources:
  jobs:
    data_ingestion_validation:
      name: data-ingestion-validation-pr-${var.pr_id}

      tasks:
        - task_key: validate_environment

          notebook_task:
            notebook_path: ../src/ingestion_validation.py

          new_cluster:
            spark_version: 15.4.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 1