name: Destroy DEV PR Resources

on:
  pull_request:
    branches:
      - main
    types:
      - closed

  workflow_dispatch:
    inputs:
      team:
        description: Team deployment boundary
        required: true
        type: choice
        options:
          - data-ingestion
          - monitoring
          - dpt

      pr_id:
        description: Pull request number whose DEV resources should be destroyed
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  resolve-dev-context:
    name: Resolve DEV Context
    runs-on: ubuntu-latest

    outputs:
      team: ${{ steps.resolve.outputs.team }}
      pr_id: ${{ steps.resolve.outputs.pr_id }}
      should_destroy: ${{ steps.resolve.outputs.should_destroy }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Resolve DEV cleanup context
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then

            TEAM="${{ inputs.team }}"
            PR_ID="${{ inputs.pr_id }}"

            echo "Manual DEV cleanup requested."
            echo "Team: $TEAM"
            echo "PR:   $PR_ID"

          else

            PR_ID="${{ github.event.pull_request.number }}"

            CHANGED_FILES="$(
              gh api \
                --paginate \
                "repos/${{ github.repository }}/pulls/${PR_ID}/files" \
                --jq '.[].filename'
            )"

            echo "PR files:"
            echo "$CHANGED_FILES"

            TEAMS="$(
              echo "$CHANGED_FILES" \
                | awk -F/ '$1 == "teams" && NF >= 2 {print $2}' \
                | sort -u
            )"

            TEAM_COUNT="$(echo "$TEAMS" | sed '/^$/d' | wc -l)"

            if [[ "$TEAM_COUNT" -eq 0 ]]; then
              echo "No team deployment boundary detected."
              echo "should_destroy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [[ "$TEAM_COUNT" -gt 1 ]]; then
              echo "ERROR: Multiple team deployment boundaries detected:"
              echo "$TEAMS"
              exit 1
            fi

            TEAM="$(echo "$TEAMS" | head -n 1)"
          fi

          echo "team=$TEAM" >> "$GITHUB_OUTPUT"
          echo "pr_id=$PR_ID" >> "$GITHUB_OUTPUT"
          echo "should_destroy=true" >> "$GITHUB_OUTPUT"

  destroy-dev:
    name: Destroy DEV
    needs: resolve-dev-context

    if: needs.resolve-dev-context.outputs.should_destroy == 'true'

    runs-on: ubuntu-latest

    concurrency:
      group: managed-analytics-dev-${{ needs.resolve-dev-context.outputs.team }}-pr-${{ needs.resolve-dev-context.outputs.pr_id }}
      cancel-in-progress: false
    environment: dev

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

    steps:
      - name: Checkout PR revision
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Checkout repository
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@60b64e3937ee15f5a8b914664d1e78a586a9a4da
        with:
          version: 1.11.0

      - name: Verify bundle configuration
        shell: bash
        run: |
          set -euo pipefail

          TEAM="${{ needs.resolve-dev-context.outputs.team }}"

          if [[ ! -f "teams/$TEAM/databricks.yml" ]]; then
            echo "ERROR: Bundle configuration not found:"
            echo "teams/$TEAM/databricks.yml"
            exit 1
          fi

      - name: Validate bundle
        working-directory: teams/${{ needs.resolve-dev-context.outputs.team }}
        shell: bash
        run: |
          set -euo pipefail

          databricks bundle validate \
            -t dev \
            --var "pr_id=${{ needs.resolve-dev-context.outputs.pr_id }}"

      - name: Destroy PR resources
        working-directory: teams/${{ needs.resolve-dev-context.outputs.team }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Destroying DEV resources for:"
          echo "  Team: ${{ needs.resolve-dev-context.outputs.team }}"
          echo "  PR:   ${{ needs.resolve-dev-context.outputs.pr_id }}"

          databricks bundle destroy \
            -t dev \
            --var "pr_id=${{ needs.resolve-dev-context.outputs.pr_id }}" \
            --auto-approve