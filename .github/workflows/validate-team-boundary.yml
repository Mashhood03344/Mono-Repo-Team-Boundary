name: Validate Team Boundary

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  validate-team-boundary:
    name: Validate Team Boundary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Get changed files
        id: changed-files
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          echo "Base SHA: $BASE_SHA"
          echo "Head SHA: $HEAD_SHA"

          git diff \
            --name-only \
            --diff-filter=ACMRD \
            "$BASE_SHA" \
            "$HEAD_SHA" \
            > changed-files.txt

          echo "Changed files:"
          cat changed-files.txt

          if [[ ! -s changed-files.txt ]]; then
            echo "No changed files detected."
            exit 1
          fi

      - name: Validate repository boundaries
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t CHANGED_FILES < changed-files.txt

          python scripts/validate_team_boundary.py \
            "${CHANGED_FILES[@]}"

      - name: Generate boundary authorization token
        id: boundary-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.BOUNDARY_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOUNDARY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-members: read

      - name: Authorize repository boundary
        shell: bash
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BOUNDARY_TOKEN: ${{ steps.boundary-token.outputs.token }}
        run: |
          set -euo pipefail

          mapfile -t CHANGED_FILES < changed-files.txt

          python scripts/authorize_team_boundary.py \
            "${CHANGED_FILES[@]}"